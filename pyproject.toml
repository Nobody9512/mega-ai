[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mega-ai"
version = "0.1.0"
description = "AI-powered data transformation tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MEGA-AI Team" }
]
keywords = ["ai", "data-transformation", "cli", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
db = [
    "mysql-connector-python>=8.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
]

[project.scripts]
mega-ai = "mega_ai.cli.main:app"

[project.urls]
Homepage = "https://github.com/mega-ai/mega-ai"
Documentation = "https://mega-ai.dev/docs"
Repository = "https://github.com/mega-ai/mega-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/mega_ai"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
